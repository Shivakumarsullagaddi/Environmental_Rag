name: Deploy Environmental AI Scientist to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: developer-491706
  REGION: us-central1
  GAR_REPOSITORY: environmental-rag
  IMAGE_NAME: app
  SERVICE_NAME: environmental-ai-scientist

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "${IMAGE_TAG}" -t "${LATEST_TAG}" .
          docker push "${IMAGE_TAG}"
          docker push "${LATEST_TAG}"

      - name: Deploy to Cloud Run (Cost-Constrained Single-Instance)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 1 \
            --min-instances 0 \
            --concurrency 1 \
            --session-affinity \
            --cpu 2 \
            --memory 2Gi \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global,BIGQUERY_LOCATION=US,BIGQUERY_DATASET=${{ env.PROJECT_ID }}.darukaa_kb,GEMINI_MODEL=gemini-3.5-flash"
